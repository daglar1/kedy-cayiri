<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9e5fa"><meta name="description" content="Bir çayır, bir sürü kedy ve bolca sevgi. Dokun, gezin, kedileri sev."><title>kedy çayırı</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fb84a7'/%3E%3Ctext x='5' y='25' font-size='25'%3E♥%3C/text%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9e5fa;color:#305240;font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif}body{touch-action:none}canvas{display:block;width:100%;height:100%;position:fixed;inset:0}header{position:absolute;top:max(36px,env(safe-area-inset-top));left:42px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:#547d79}h1{font-size:38px;letter-spacing:-2px;margin:7px 0 2px;font-weight:900}h1 span{color:#ed7095;font-size:22px;vertical-align:top;margin-left:9px}header p{font-size:14px;margin:4px 0;color:#527b74}.tag{position:absolute;right:36px;top:max(42px,env(safe-area-inset-top));background:#ffffffa8;border:1px solid #ffffffb0;border-radius:30px;padding:11px 17px;font-size:13px;font-weight:700;backdrop-filter:blur(10px);pointer-events:none}.pixel-heart{color:#eb7295;margin-right:6px}footer{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(360px,88vw);text-align:center;pointer-events:none}footer p{font-size:13px;font-weight:700;color:#244e32;text-shadow:0 1px 3px #d0f0b7;margin:0 0 17px}button{pointer-events:auto;cursor:pointer;touch-action:manipulation;width:100%;border:2px solid #713c50;border-radius:17px;background:#ff9fb8;color:#522738;box-shadow:0 6px 0 #98526b,0 12px 28px #365d3b25;padding:18px 24px;font-family:inherit;font-size:24px;font-weight:900;letter-spacing:-.7px;transition:transform .08s,box-shadow .08s}button span{font-size:21px;color:#b4446d;margin:0 17px}button:active,button.pressed{transform:translateY(5px);box-shadow:0 1px 0 #98526b,0 5px 18px #365d3b25}button:focus-visible{outline:4px solid white;outline-offset:5px}.tiny{margin-top:17px;font-size:11px;color:#365f39;letter-spacing:1px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{top:max(27px,env(safe-area-inset-top));left:24px}h1{font-size:31px}.tag{top:128px;left:24px;right:auto;padding:8px 12px;font-size:12px}.eyebrow{font-size:10px}footer{bottom:max(25px,env(safe-area-inset-bottom))}button{padding:17px 15px}}
</style></head><body><canvas id="world" aria-label="Düz çimen dünyasında kadın karakter ve onu takip eden rengârenk kediler. Yürümek için yere dokun veya yön tuşlarını kullan."></canvas><header><div class="eyebrow">HUZURLU BİR KÖŞE</div><h1>kedy çayırı<span>♥</span></h1><p>bir sürü kedy, bolca sevgi.</p></header><div class="tag"><span class="pixel-heart">♥</span> <span id="count">12 küçük dost</span></div><footer><p id="hint">Çayıra dokun, kediler peşinden gelsin.</p><button id="pet" type="button"><span aria-hidden="true">♥</span> Sev: kedy <span aria-hidden="true">♥</span></button><div class="tiny">acele yok. sadece mır mır.</div></footer><div id="announce" role="status" aria-live="polite" class="sr"></div><script>'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),button=document.getElementById('pet');
let W,H,S,originY,now=0,last=0,loveUntil=0,steps=0,petCount=0;const keys=new Set(),player={x:0,z:0,tx:0,tz:0},hearts=[],faces=[];
const colors=[['#f9eee0','#dfb990'],['#f4aa51','#b97237'],['#53566b','#35384c'],['#e1e7ee','#919cb0'],['#d7a2ed','#976fc3'],['#f5a9bc','#d67597'],['#b5e0e5','#6eb9cb'],['#c2b0a0','#857163'],['#faf1d9','#464756'],['#d19c64','#8b6042'],['#d2deb7','#94ad76'],['#f8d375','#d69e49']];
const cats=colors.map((c,i)=>({x:Math.cos(i*2.4)*(2+i%3),z:Math.sin(i*2.4)*(2+i%3),color:c[0],patch:c[1],phase:i*1.73,hop:0}));
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W/12,H/13,65);originY=H*.57}resize();addEventListener('resize',resize);
function project(x,y,z){return [W/2+(x-z)*S*.88,originY+(x+z)*S*.43-y*S]}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function shade(hex,m){const n=parseInt(hex.slice(1),16);return `rgb(${Math.min(255,(n>>16)*m)},${Math.min(255,(n>>8&255)*m)},${Math.min(255,(n&255)*m)})`}
function box(x,y,z,w,h,d,c){const a=project(x-w/2,y,z-d/2),b=project(x+w/2,y,z-d/2),c1=project(x+w/2,y,z+d/2),e=project(x-w/2,y,z+d/2),A=project(x-w/2,y+h,z-d/2),B=project(x+w/2,y+h,z-d/2),C=project(x+w/2,y+h,z+d/2),E=project(x-w/2,y+h,z+d/2);faces.push({depth:x+z+y*.015,draw(){poly([e,c1,C,E],shade(c,.85));poly([b,c1,C,B],shade(c,.69));poly([A,B,C,E],shade(c,1.07))}})}
function shadow(x,z,r){const p=project(x,0,z);ctx.fillStyle='#315d3525';ctx.beginPath();ctx.ellipse(p[0],p[1]+3,r*S,r*S*.36,0,0,Math.PI*2);ctx.fill()}
function cat(c,t){const x=c.x,z=c.z,y=c.hop;const stride=Math.sin(t*9+c.phase)*.05;
box(x,y+.18,z,.44,.34,.7,c.color);box(x,y+.43,z+.33,.55,.43,.43,c.color);
box(x-.19,y+.84,z+.31,.15,.23,.17,c.color);box(x+.19,y+.84,z+.31,.15,.23,.17,c.color);
box(x-.19,y+.85,z+.407,.075,.12,.025,'#f2a1ae');box(x+.19,y+.85,z+.407,.075,.12,.025,'#f2a1ae');
for(const a of [-1,1])for(const b of [-1,1])box(x+a*.15,y+Math.max(0,a*b*stride),z+b*.24,.13,.25,.14,c.patch);
box(x,y+.46,z-.41,.11,.39,.12,c.patch);box(x+.065*Math.sin(t*3+c.phase),y+.8,z-.41,.13,.19,.12,c.patch);
box(x+.13,y+.57,z+.555,.085,.105,.016,'#30484d');box(x-.13,y+.57,z+.555,.085,.105,.016,'#30484d');box(x,y+.49,z+.56,.085,.055,.02,'#dc8392');box(x-.1,y+.69,z+.56,.14,.045,.014,c.patch);if(c.phase%3<2)box(x,y+.528,z-.04,.45,.035,.14,c.patch);
}
function woman(t,moving){const x=player.x,z=player.z,bob=moving?Math.abs(Math.sin(t*9))*.055:Math.sin(t*2)*.018;
const leg=moving?Math.sin(t*9)*.13:0;
box(x-.15,bob+Math.max(0,leg),z,.26,.67,.3,'#596db8');box(x+.15,bob+Math.max(0,-leg),z,.26,.67,.3,'#596db8');
box(x-.15,bob+Math.max(0,leg),z+.05,.27,.13,.38,'#514763');box(x+.15,bob+Math.max(0,-leg),z+.05,.27,.13,.38,'#514763');
box(x,bob+.65,z,.63,.7,.37,'#43b5b0');box(x-.45,bob+.75,z,.25,.55,.29,'#edba98');box(x+.45,bob+.75+(now<loveUntil?.23:0),z,.25,.55,.29,'#edba98');box(x-.45,bob+1.12,z,.27,.23,.32,'#43b5b0');box(x+.45,bob+1.12+(now<loveUntil?.23:0),z,.27,.23,.32,'#43b5b0');
box(x,bob+1.34,z,.64,.65,.57,'#edba98');box(x,bob+1.9,z-.02,.7,.16,.63,'#64402e');box(x-.28,bob+1.43,z-.1,.18,.59,.46,'#704832');box(x+.28,bob+1.19,z-.1,.18,.83,.45,'#704832');box(x-.08,bob+1.79,z+.3,.51,.17,.04,'#704832');
for(const d of [-1,1]){box(x+d*.14,bob+1.62,z+.296,.13,.09,.02,'#fcf6e9');box(x+d*.135,bob+1.62,z+.309,.06,.09,.015,'#538783');box(x+d*.21,bob+1.5,z+.3,.09,.06,.02,'#e3948d')}box(x,bob+1.45,z+.305,.13,.035,.02,'#b86b65');box(x+.36,bob+1.8,z+.13,.16,.16,.09,'#ef97b6');box(x+.37,bob+1.85,z+.14,.05,.06,.1,'#ffe4a5');}
const grass=Array.from({length:170},(_,i)=>({x:Math.sin(i*127.1)*17,z:Math.cos(i*311.7)*17,flower:i%9===0,color:['#fff4d4','#f4a4c3','#bf9fe6'][i%3]}));
function ground(t){const sky=ctx.createLinearGradient(0,0,0,H*.65);sky.addColorStop(0,'#acdff6');sky.addColorStop(1,'#e8f3db');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const horizon=H*.3;ctx.fillStyle='#a8cc83';ctx.fillRect(0,horizon,W,H);ctx.fillStyle='#99c577';ctx.fillRect(0,horizon+11,W,H);
ctx.fillStyle='#fffdf0';ctx.fillRect(W*.78, H*.075,37,37);ctx.fillStyle='#ffffff8a';for(let i=0;i<6;i++){let x=((i*W*.26+t*3)%(W+220))-110,y=H*(.1+(i%3)*.054);ctx.fillRect(x,y,86,15);ctx.fillRect(x+20,y-12,47,13)}
ctx.save();ctx.beginPath();ctx.rect(0,horizon+20,W,H);ctx.clip();for(let x=-28;x<29;x++)for(let z=-28;z<29;z++){const p=project(x,0,z);if(p[1]<horizon||p[1]>H+S||p[0]<-S*2||p[0]>W+S*2)continue;const n=Math.abs(Math.sin(x*79.7+z*131.3));poly([p,project(x+1,0,z),project(x+1,0,z+1),project(x,0,z+1)],n>.7?'#99c977':n>.35?'#9ecc7a':'#a1cf7d')}
for(const g of grass){const p=project(g.x,0,g.z);if(p[1]<horizon+35||p[1]>H||p[0]<0||p[0]>W)continue;ctx.fillStyle='#79ad5b';ctx.fillRect(p[0],p[1]-5,2,6);ctx.fillRect(p[0]-3,p[1]-3,2,3);if(g.flower){ctx.fillStyle=g.color;ctx.fillRect(p[0]-3,p[1]-9,8,5);ctx.fillRect(p[0],p[1]-12,3,11);ctx.fillStyle='#f6d76e';ctx.fillRect(p[0],p[1]-8,3,3)}}ctx.restore()}
const heartPixels=['0110110','1111111','1111111','0111110','0011100','0001000'];
function heart(h,dt){h.age+=dt;const p=project(h.x+h.age*h.drift,h.y+h.age*.85,h.z);ctx.globalAlpha=Math.max(0,1-h.age/2.4);const q=h.size*S*.045;ctx.fillStyle=h.color;heartPixels.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='1')ctx.fillRect(Math.round(p[0]+(x-3)*q),Math.round(p[1]+y*q),Math.ceil(q),Math.ceil(q))}));ctx.globalAlpha=1}
let audio;function purr(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const a=audio.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,a+i*.055);g.gain.setValueAtTime(0,a+i*.055);g.gain.linearRampToValueAtTime(.035,a+i*.055+.02);g.gain.exponentialRampToValueAtTime(.001,a+i*.055+.28);o.connect(g).connect(audio.destination);o.start(a+i*.055);o.stop(a+i*.055+.3)})}catch{}}
button.addEventListener('click',()=>{loveUntil=now+1.4;petCount++;for(const c of cats)for(let j=0;j<3;j++)hearts.push({x:c.x+(Math.random()-.5)*.8,z:c.z,y:1+Math.random()*.5,age:-j*.13,size:.65+Math.random()*.45,drift:(Math.random()-.5)*.4,color:['#ee648e','#ff89ad','#ffb4c5'][j]});if(hearts.length>240)hearts.splice(0,hearts.length-240);document.getElementById('announce').textContent='Bütün kediler sevildi!';document.getElementById('hint').textContent=['Mırrr… hepsi seni çok seviyor.','Minik patiler, kocaman kalpler.','Burada sevgi hiç bitmez.'][petCount%3];purr()});
canvas.addEventListener('pointerdown',e=>{const a=(e.clientX-W/2)/(S*.88),b=(e.clientY-originY)/(S*.43);player.tx=Math.max(-5,Math.min(5,(a+b)/2));player.tz=Math.max(-5,Math.min(5,(b-a)/2));});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys.add(e.key);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>keys.clear());
function frame(ms){const t=ms/1000,dt=Math.min(.04,(ms-last)/1000||.016);last=ms;now=t;let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);if(dx||dy){player.tx=Math.max(-5,Math.min(5,player.x+(dx+dy)*.6));player.tz=Math.max(-5,Math.min(5,player.z+(dy-dx)*.6))}const dist=Math.hypot(player.tx-player.x,player.tz-player.z),speed=Math.min(1,dt*2.2/Math.max(dist,.001));player.x+=(player.tx-player.x)*speed;player.z+=(player.tz-player.z)*speed;
ground(t);faces.length=0;shadow(player.x,player.z,.47);woman(t,dist>.05);cats.forEach((c,i)=>{const a=i*2.399+t*.09,r=1.65+(i%3)*.65,tx=player.x+Math.cos(a)*r,tz=player.z+Math.sin(a)*r; c.x+=(tx-c.x)*dt*.8;c.z+=(tz-c.z)*dt*.8;c.hop=Math.max(0,Math.sin(t*(now<loveUntil?7:3)+c.phase))*(now<loveUntil?.55:.22);shadow(c.x,c.z,.35);cat(c,t)});faces.sort((a,b)=>a.depth-b.depth);faces.forEach(f=>f.draw());for(let i=hearts.length-1;i>=0;i--){heart(hearts[i],dt);if(hearts[i].age>2.4)hearts.splice(i,1)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
